# 默认配置。密码、密钥等敏感项不要写在这里，通过环境变量（MK_ 前缀）或 server/.env 提供。
app:
  name: mkclou
  env: development
  port: 18080             # 避开常用的 8080（本机其他 Java 服务常占用）
  shutdown_timeout: 10s
  cors_origins:
    - http://localhost:3000
  public_url: http://localhost:3000

log:
  level: debug
  format: console

mysql:
  host: 127.0.0.1
  port: 3307
  user: mkclou
  password: ""
  database: mkclou
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 30m

redis:
  addr: 127.0.0.1:6380
  password: ""
  db: 0

s3:
  endpoint: http://127.0.0.1:9000
  region: us-east-1
  access_key: ""
  secret_key: ""
  public_bucket: mkclou-public
  private_bucket: mkclou-private
  use_path_style: true
  public_base_url: ""     # 生产环境填 CDN 域名；为空时为 endpoint/public_bucket

auth:
  jwt_secret: ""            # 通过 MK_AUTH_JWT_SECRET 提供，至少 32 个字符
  access_ttl: 15m
  refresh_ttl: 168h         # 7 天
  remember_ttl: 720h        # 勾选“记住我”：30 天
  refresh_cookie: mk_rt
  cookie_secure: false      # 生产环境必须为 true
  bcrypt_cost: 12
  verify_email_ttl: 24h
  reset_password_ttl: 30m

mail:
  host: 127.0.0.1           # 本地使用 Mailpit：http://127.0.0.1:8025 查看邮件
  port: 11025             # Docker Desktop 在本机绑定 1025 端口失败，改用高位端口
  username: ""
  password: ""
  from: "MkClou <no-reply@mkclou.local>"
  tls: false

shop:
  slug_change_interval: 720h   # 30 天
  slug_redirect_ttl: 2160h     # 90 天
  public_cache_ttl: 5m
  reserved_slugs:
    - admin
    - api
    - app
    - assets
    - checkout
    - dashboard
    - docs
    - help
    - login
    - logout
    - mail
    - mkclou
    - onboarding
    - orders
    - pay
    - register
    - root
    - shop
    - static
    - status
    - support
    - system
    - www
